# =============================================================================
# Docker Compose for Mini-AGI Backend - Production Configuration
# =============================================================================
# This file includes all services for a production deployment:
# - Backend API (FastAPI)
# - PostgreSQL (persistent database)
# - Redis (caching and rate limiting)
# - Ollama (optional LLM provider)
# - Jaeger (optional distributed tracing)
# - Prometheus (optional metrics collection)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Backend Service - Mini-AGI FastAPI Application
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mini-agi-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      # LLM Provider Configuration
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_MODEL=${LLM_MODEL:-llama3.1:8b}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.2}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-8000}

      # Ollama Configuration
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}

      # Z.AI Configuration
      - ZAI_API_KEY=${ZAI_API_KEY:-}
      - ZAI_BASE_URL=${ZAI_BASE_URL:-https://api.z.ai/api/coding/paas/v4}

      # Database Configuration
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-miniagi}:${POSTGRES_PASSWORD:-miniagi_pass}@postgres:5432/${POSTGRES_DB:-miniagi}
      - DATABASE_POOL_SIZE=${DATABASE_POOL_SIZE:-10}
      - DATABASE_ECHO=false

      # Redis Configuration
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-3600}
      - REDIS_MAX_CONNECTIONS=${REDIS_MAX_CONNECTIONS:-10}

      # Security Configuration
      - API_KEYS=${API_KEYS:-dev-key-123456789}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-admin-key-master-12345}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-60}
      - RATE_LIMIT_PER_HOUR=${RATE_LIMIT_PER_HOUR:-1000}
      - MAX_REQUEST_SIZE=${MAX_REQUEST_SIZE:-10485760}

      # CORS Configuration
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - CORS_ALLOW_CREDENTIALS=true

      # Logging Configuration
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - LOG_JSON=${LOG_JSON:-true}

      # Telemetry Configuration
      - TELEMETRY_ENABLED=${TELEMETRY_ENABLED:-true}
      - PROMETHEUS_ENABLED=${PROMETHEUS_ENABLED:-true}
      - PROMETHEUS_PORT=${PROMETHEUS_PORT:-9090}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}
      - OTEL_CONSOLE_EXPORT=${OTEL_CONSOLE_EXPORT:-false}

      # Compression
      - COMPRESSION_ENABLED=${COMPRESSION_ENABLED:-true}
      - COMPRESSION_MINIMUM_SIZE=${COMPRESSION_MINIMUM_SIZE:-500}

      # Application Configuration
      - MAX_ORCHESTRATION_STEPS=${MAX_ORCHESTRATION_STEPS:-10}
      - ENVIRONMENT=${ENVIRONMENT:-production}

    volumes:
      # Mount instruction files for personas
      - ./backend/instruction:/app/backend/instruction:ro
      # Persistent data storage
      - backend_data:/app/backend/data

    networks:
      - backend-net

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    deploy:
      resources:
        limits:
          cpus: ${BACKEND_CPUS:-1}
          memory: ${BACKEND_MEMORY:-1G}
        reservations:
          cpus: ${BACKEND_CPUS_RESERVE:-0.25}
          memory: ${BACKEND_MEMORY_RESERVE:-256M}

  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: mini-agi-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-miniagi}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-miniagi_pass}
      - POSTGRES_DB=${POSTGRES_DB:-miniagi}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-miniagi}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: ${POSTGRES_CPUS:-0.5}
          memory: ${POSTGRES_MEMORY:-512M}

  # ---------------------------------------------------------------------------
  # Redis Cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: mini-agi-redis
    command: redis-server --appendonly yes --maxmemory ${REDIS_MAX_MEMORY:-256mb} --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - backend-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: ${REDIS_CPUS:-0.25}
          memory: ${REDIS_MEMORY:-256M}

  # ---------------------------------------------------------------------------
  # Ollama LLM Provider (optional)
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: mini-agi-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      - OLLAMA_ORIGINS=${OLLAMA_ORIGINS:-*}
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - backend-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: ${OLLAMA_CPUS:-2}
          memory: ${OLLAMA_MEMORY:-4G}
        reservations:
          cpus: ${OLLAMA_CPUS_RESERVE:-0.5}
          memory: ${OLLAMA_MEMORY_RESERVE:-2G}
    # GPU support (uncomment if host has NVIDIA GPU)
    # deploy:
    #   runtime: nvidia

  # ---------------------------------------------------------------------------
  # Jaeger Distributed Tracing (optional)
  # ---------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: mini-agi-jaeger
    ports:
      - "5775:5775"  # accept zipkin.thrift over compact thrift protocol
      - "6831:6831"  # serve Jaeger UI
      - "6832:6832"  # serve Jaeger UI with TLS
      - "5778:5778"  # serve Zipkin compatible endpoints
      - "16686:16686"  # serve http
      - "14268:14268"  # serve gRPC
      - "14250:14250"  # serve model metrics
      - "9411:9411"  # serve GRPC (debug)
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    networks:
      - backend-net
    restart: unless-stopped
    profiles:
      - tracing

  # ---------------------------------------------------------------------------
  # Prometheus Metrics (optional)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: mini-agi-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - backend-net
    restart: unless-stopped
    profiles:
      - metrics
    depends_on:
      - backend

# =============================================================================
# Networks
# =============================================================================
networks:
  backend-net:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local
  backend_data:
    driver: local
  prometheus_data:
    driver: local
