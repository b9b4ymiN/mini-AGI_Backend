# =============================================================================
# Prometheus Configuration for Mini-AGI Backend
# =============================================================================
# Scrape configuration for collecting metrics from the backend service
# =============================================================================

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

# Alerting configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#             - alertmanager:9093

# Rule files (optional)
# rule_files:
#   - 'alerts.yml'

# Scrape configurations
scrape_configs:
  # Backend application metrics
  - job_name: 'mini-agi-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
